name: GTA Events Monitor

on:
  schedule:
    # Weekly on Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

jobs:
  events:
    name: Scrape GTA Networking Events
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CLOUDFLARE_ACCOUNT_ID:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run events monitor
        run: node pipeline/run-events.js

      - name: Commit updated events report
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add events/
          git diff --cached --quiet || git commit -m "Update GTA networking events report $(date -u +%F)"
          git push
