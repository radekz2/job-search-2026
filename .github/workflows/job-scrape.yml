name: Job Search Pipeline

on:
  schedule:
    # Daily at 10:00 UTC (6:00 AM EDT)
    - cron: '0 10 * * *'
  workflow_dispatch: {}   # allow manual trigger from GitHub UI

jobs:
  pipeline:
    name: Scrape + Score + Write to Database
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL:           ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      OPENAI_BASE_URL:        ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      NETLIFY_DATABASE_URL:   ${{ secrets.NETLIFY_DATABASE_URL }}
      DEEP_DIVE_N:            ${{ vars.DEEP_DIVE_N || '40' }}
      ADZUNA_APP_ID:          ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY:         ${{ secrets.ADZUNA_APP_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        run: node --experimental-vm-modules pipeline/run-pipeline.js
